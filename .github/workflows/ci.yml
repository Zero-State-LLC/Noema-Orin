name: Synthetic foundation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-foundation:
    name: Synthetic foundation (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: '3.10'}
          - {os: ubuntu-latest, python-version: '3.11'}
          - {os: ubuntu-latest, python-version: '3.12'}
          - {os: ubuntu-latest, python-version: '3.13'}
          - {os: ubuntu-24.04-arm, python-version: '3.10'}
          - {os: ubuntu-24.04-arm, python-version: '3.12'}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify synthetic runner and boundary tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Verify CLI dry-run
        env:
          PYTHONPATH: src
        run: python -m noema_orin --profile hosted --fixture fixtures/hosted-look.json --dry-run
      - name: Install package from checkout
        run: python -m pip install .
      - name: Verify installed CLI outside source tree
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          import noema_orin

          assert not noema_orin.__file__.startswith(os.environ["GITHUB_WORKSPACE"])
          env = dict(os.environ)
          env.pop("PYTHONPATH", None)
          env.pop("PYTHONHOME", None)
          common = {
              "source_sha": "619d0674518761aa08462d3f5d5966a917259aa1",
              "claim_label": "SPECULATIVE",
              "client_version": "UNVERIFIED",
              "device_metrics": "NOT_COMPUTABLE",
          }
          for args, expected_exit, expected_record in (
              (["hosted", "--fixture", os.path.join(os.environ["GITHUB_WORKSPACE"], "fixtures/hosted-look.json")],
               0, {**common, "status": "ATTEMPTED", "result": "FAKE_HANDOFF",
                   "profile": "hosted", "transport": "fake", "action": "LOOK"}),
              (["offline-spark"], 1,
               {**common, "status": "REFUSED", "result": "BLOCKED_SPEC_DEFECT"}),
          ):
              result = subprocess.run(
                  [sys.executable, "-m", "noema_orin", "--profile", *args, "--dry-run"],
                  env=env, capture_output=True, text=True, check=False,
              )
              assert result.returncode == expected_exit, (args[0], result.returncode)
              assert result.stderr == "", (args[0], "unexpected stderr")
              assert len(result.stdout.splitlines()) == 1, (args[0], "record count")
              record = json.loads(result.stdout)
              assert record == expected_record, (args[0], "unexpected receipt shape or value")
          PY
      - name: Verify installed preflight outside source tree
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import sysconfig

          import noema_orin

          roots = [Path(sysconfig.get_path(name)).resolve() for name in ("purelib", "platlib")]
          origin = Path(noema_orin.__file__).resolve()
          assert any(origin.is_relative_to(root) for root in roots), "source import instead of installed package"
          env = dict(os.environ)
          env.pop("PYTHONPATH", None)
          env.pop("PYTHONHOME", None)
          result = subprocess.run([sys.executable, "-m", "noema_orin.preflight"],
                                  env=env, capture_output=True, text=True, check=False)
          assert result.returncode == 0 and result.stderr == "", "preflight failed"
          assert len(result.stdout.splitlines()) == 1, "unexpected record count"
          record = json.loads(result.stdout)
          fixed = {
              "source_sha": "619d0674518761aa08462d3f5d5966a917259aa1",
              "claim_label": "SPECULATIVE",
              "evidence_scope": "LOCAL_PREFLIGHT_ONLY",
              "machine": "aarch64" if os.uname().machine == "aarch64" else "x86_64",
              "l4t_release": "NOT_COMPUTABLE",
              "device_family": "NOT_COMPUTABLE",
              "python_version": ".".join(map(str, sys.version_info[:3])),
              "client_version": "NOT_COMPUTABLE",
              "jetpack_version": "NOT_COMPUTABLE",
              "device_metrics": "NOT_COMPUTABLE",
              "model_load": "NOT_COMPUTABLE",
              "tokens_per_second": "NOT_COMPUTABLE",
              "power": "NOT_COMPUTABLE",
              "command_latency": "NOT_COMPUTABLE",
          }
          for field in ("os_id", "os_version", "ram_gib_bucket", "storage_free_gib_bucket"):
              assert field in record, field
          assert {k: v for k, v in record.items() if k not in
                  ("os_id", "os_version", "ram_gib_bucket", "storage_free_gib_bucket")} == fixed
          assert record["os_id"] == "ubuntu"
          assert record["os_version"] in ("22.04", "24.04", "NOT_COMPUTABLE")
          for field in ("ram_gib_bucket", "storage_free_gib_bucket"):
              assert record[field] in ("NOT_COMPUTABLE", "0-4", "4-8", "8-16", "16-32", "32-64", "64-128", "128+")
          assert "noema_client" not in sys.modules
          PY
      - name: Verify patch hygiene
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "$(git merge-base origin/main HEAD)" HEAD
          else
            git diff --check HEAD^ HEAD
          fi
  official-client-loopback:
    name: Official client loopback (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: '3.11'}
          - {os: ubuntu-latest, python-version: '3.12'}
          - {os: ubuntu-latest, python-version: '3.13'}
          - {os: ubuntu-24.04-arm, python-version: '3.12'}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7.0.1
        with:
          repository: Zero-State-LLC/noema-client
          ref: 16ec5d1f472295055439975f88567a43fe6ee3b0
          path: client-pin
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact client and Orin package
        run: |
          test "$(git -C client-pin rev-parse HEAD)" = 16ec5d1f472295055439975f88567a43fe6ee3b0
          python -m pip install ./client-pin .
      - name: Verify installed real client against loopback fixture
        env:
          NOEMA_TOKEN: ''
          NOEMA_SERVER: ''
          NOEMA_CONFIG_DIR: ''
          NOEMA_WORLD_ID: ''
          NOEMA_ADMIN_TOKEN: ''
          XDG_CONFIG_HOME: ''
        run: |
          cd "$RUNNER_TEMP"
          env -u PYTHONHOME NOEMA_ORIN_ASSERT_INSTALLED=1 PYTHONPATH="$GITHUB_WORKSPACE/client-pin/tests" python -m unittest discover -s "$GITHUB_WORKSPACE/tests_optional" -p 'test_official_client.py' -v
      - name: Verify patch hygiene
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "$(git merge-base origin/main HEAD)" HEAD
          else
            git diff --check HEAD^ HEAD
          fi
