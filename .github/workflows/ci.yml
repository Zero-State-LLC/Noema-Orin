name: Synthetic foundation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-foundation:
    name: Synthetic foundation (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: '3.10'}
          - {os: ubuntu-latest, python-version: '3.11'}
          - {os: ubuntu-latest, python-version: '3.12'}
          - {os: ubuntu-latest, python-version: '3.13'}
          - {os: ubuntu-24.04-arm, python-version: '3.10'}
          - {os: ubuntu-24.04-arm, python-version: '3.12'}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify synthetic runner and boundary tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Verify CLI dry-run
        env:
          PYTHONPATH: src
        run: python -m noema_orin --profile hosted --fixture fixtures/hosted-look.json --dry-run
      - name: Install package from checkout
        run: python -m pip install .
      - name: Verify installed CLI outside source tree
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          import noema_orin

          assert not noema_orin.__file__.startswith(os.environ["GITHUB_WORKSPACE"])
          env = dict(os.environ)
          env.pop("PYTHONPATH", None)
          env.pop("PYTHONHOME", None)
          for args, expected_exit, expected_status, expected_result in (
              (["hosted", "--fixture", os.path.join(os.environ["GITHUB_WORKSPACE"], "fixtures/hosted-look.json")], 0, "ATTEMPTED", "FAKE_HANDOFF"),
              (["offline-spark"], 1, "REFUSED", "BLOCKED_SPEC_DEFECT"),
          ):
              result = subprocess.run(
                  [sys.executable, "-m", "noema_orin", "--profile", *args, "--dry-run"],
                  env=env, capture_output=True, text=True, check=False,
              )
              assert result.returncode == expected_exit, (args[0], result.returncode)
              assert result.stderr == "", (args[0], "unexpected stderr")
              assert len(result.stdout.splitlines()) == 1, (args[0], "record count")
              record = json.loads(result.stdout)
              assert (record["status"], record["result"]) == (expected_status, expected_result)
          PY
      - name: Verify patch hygiene
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "$(git merge-base origin/main HEAD)" HEAD
          else
            git diff --check HEAD^ HEAD
          fi
